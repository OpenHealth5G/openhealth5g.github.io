members:
  - name: "Prof. Dr. Juliano Araujo Wickboldt"
    role: "General Coordinator"
    affiliation: "UFRGS"
    bio: "CNPq research fellow (Level C) and Associate Professor at UFRGS Institute of Computing. Leads the OpenHealth5G project across all partner institutions, with research focus on 5G/6G technologies, network slicing, software-defined and programmable networks, edge computing, digital twins, and distributed systems. Previously conducted post-doctoral research in converged optical/wireless networks under the EU-Brazil FUTEBOL (H2020) project."
    image: "images/team-professor-juliano.jpg"
    lattes: "http://lattes.cnpq.br/9858319665065036"
    github: "julianowick"

  - name: "Prof. Dr. Muriel Figueredo Franco"
    role: "Local Coordinator"
    affiliation: "UFCSPA"
    bio: "Assistant Professor of Computer Science and Biomedical Informatics at UFCSPA and member of the Digital Health Hub. Ph.D. (Summa Cum Laude, 2023) in Computer Science from the University of Zurich. Research spans cybersecurity, computer networks, blockchain, AI, and health applications. Previously participated in RNP working groups on virtualized network functions (GT-FENDE) and cyberattack economics (GT-IMPACTO), and the H2020 CONCORDIA and FAPESP PROFISSA projects."
    image: "images/team-professor-muriel.jpg"
    lattes: "http://lattes.cnpq.br/5417317635081894"
    github: "murielfranco"

  - name: "Prof. Dr. Tiago Coelho Ferreto"
    role: "Local Coordinator"
    affiliation: "PUCRS"
    bio: "Associate Professor at PUCRS Polytechnic School and coordinator of the Computer Science Graduate Program since 2024. Leads the High Performance Laboratory (GRIN group) and holds a CNPq technology development fellowship (Level 2). Research focuses on cloud and edge computing, IT infrastructure management, computer networks, high-performance computing, and big data."
    image: "images/team-professor-tiago.jpg"
    lattes: "http://lattes.cnpq.br/8685431534934812"
    github: "tferreto"

  - name: "Prof. Dr. Lucio Rene Prade"
    role: "Local Coordinator"
    affiliation: "UNISINOS"
    bio: "Professor at UNISINOS since 2011 in the Electrical Engineering Graduate Program. Ph.D. in Electrical Engineering from UFSM. Member of the GT-Plateou working group on end-to-end Open RAN slices. Active in the Innova Excellence Center for 5G/6G networks funded by FINEP. Research spans open/aggregated networks, private networks, IoT, robotics, Industry 4.0, and embedded systems for telecommunications."
    image: "images/team-professor-lucio.jpg"
    lattes: "http://lattes.cnpq.br/6011299816045062"
    github: "luciorene"

  - name: "Prof. Dr. Alexandre Huff"
    role: "Collaborator"
    affiliation: "UTFPR"
    bio: "Professor at UTFPR since 2013. Active in the O-RAN Software Community since 2019, maintaining official repositories including RIC Message Router (RMR), Traffic Steering xApp, xApp Frame CPP, and Cell Configuration and Control xApp. Research focuses on Near-Real-Time RIC development, E2SM-KPM and E2SM-RC models, and Open RAN simulation with E2Sim. Previously conducted sandwich doctorate research at AT&T (USA) with collaborations at Virginia Tech."
    image: "images/team-professor-alexandre.jpg"
    lattes: "http://lattes.cnpq.br/8204869834246714"
    github: "ahuff"

  - name: "Prof. Dr. Cristiano Bonato Both"
    role: "Collaborator"
    affiliation: "UNISINOS"
    bio: "Professor since 2019 at UNISINOS Applied Computer Science Graduate Program (PPGCA) and visiting researcher at UNICAMP's SMARTNESS engineering center in partnership with Ericsson. CNPq research fellow (Level C). Coordinates the Innova Excellence Center for 5G/6G networks. Research on open/aggregated networks, Open RAN, SDN, AI integration, and 6G evolution. International collaborations with Virginia Tech, Trinity College Dublin, University of Leeds, Ericsson, and Telefónica."
    image: "images/team-professor-cristiano.jpg"
    lattes: "http://lattes.cnpq.br/2658002010026792"
    github: "cboth"

  - name: "Prof. Dra. Graciele Fernanda da Costa Linch"
    role: "Research Fellow"
    affiliation: "UFCSPA"
    bio: "Associate Professor at UFCSPA across Nursing and Biomedical Informatics programs, and co-director of Graduate Programs. Ph.D. in Nursing from UFRGS with a sandwich doctorate at the University of Illinois at Chicago (USA) as a WHO Collaborating Center. Leads the GEEPET/CNPq evidence-based nursing research group and serves as Associate Dean for Research, Development and Innovation."
    image: "images/team-professor-graciele.jpg"
    lattes: "http://lattes.cnpq.br/4314635435676056"

  - name: "Prof. Dra. Isabel Cristina Siqueira da Silva"
    role: "Research Fellow"
    affiliation: "UFCSPA"
    bio: "Assistant Professor at UFCSPA and coordinator of the Biomedical Informatics course and Digital Health Hub. Ph.D. in Computer Science from UFRGS with sandwich doctorate at La Sapienza University of Rome. Research focuses on digital health, analytical data visualization, 3D interaction, extended reality (XR), usability, game design, and assistive technology."
    image: "images/team-professor-isabel.jpg"
    lattes: "http://lattes.cnpq.br/7221692456270122"
    github: "isabellsiqueira"

  - name: "Prof. MSc. José Antônio Linch Burmann"
    role: "Student (PhD Candidate)"
    affiliation: "UFCSPA"
    bio: "Substitute Professor of Health Informatics at UFCSPA and doctoral candidate in Systems and Information Technology Management at UFRGS. Master's in Information Technology and Health Management from UFCSPA. Full-stack backend developer at Instituto de Pesquisas Eldorado and member of the TelessaúdeRS development team (UFRGS). Research focus: health data interoperability, governance, and digital health systems."
    image: "images/team-student-jose.jpg"
    lattes: "http://lattes.cnpq.br/5817399860875888"
    github: "jburmann"

  - name: "MSc. Claudio Salvalaio"
    role: "Student (PhD Candidate)"
    affiliation: "UFCSPA"
    bio: "Doctoral candidate in Rehabilitation Sciences (Neurorehabilitation focus) at UFCSPA and CAPES fellow. Coordinator of the NERV/UFCSPA Virtual Reality Rehabilitation project funded by CNPq. Master's in Design from UFRGS with experience in health-oriented design, assistive technology, and human-centered interdisciplinary project management. Research: EEG signals, AI, VR, wearable robotics, and olfactory stimulation for neurological rehabilitation."
    image: "images/team-student-claudio.jpg"
    lattes: "http://lattes.cnpq.br/0550133671937549"
    github: "csalvalaio"
