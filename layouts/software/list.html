{{ define "main" }}

{{ partial "hero" . }}

<section class="section-soft">
  <div class="wrap">
  <h2 class="section-title">Software Projects</h2>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-group" data-group="status" data-key="status">
      <span class="filter-label">Status</span>
      <div class="filter-chips"></div>
    </div>
  </div>

  <div class="card-grid">
    {{ range site.Data.software.projects }}
    <article class="card software-card filter-item" data-filter-group="software" data-status="{{ lower .status }}">
      <div class="card-head">
        <h3>{{ .project_name }}</h3>
        <span class="status-badge status-{{ .status | lower }}">{{ .status | title }}</span>
      </div>
      <p>{{ .description }}</p>
      <div class="card-meta">
        <a href="{{ .repository_url }}" target="_blank" rel="noopener" class="cta-primary cta-small">View Repository &rarr;</a>
      </div>
    </article>
    {{ end }}
  </div>
  </div>
</section>

{{ end }}
