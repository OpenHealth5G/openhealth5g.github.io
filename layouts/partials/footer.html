<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-grid">
      <div class="footer-brand">
        <a href="{{ .Site.BaseURL }}" class="footer-brand-logo">
          <img src="{{ "images/logo.svg" | relURL }}" alt="OpenHealth5G" class="footer-logo-icon">
        </a>
        <p class="footer-tagline">Open-source research infrastructure for healthcare connectivity</p>
      </div>
      <div class="footer-links">
        <h4 class="footer-heading">Navigate</h4>
        <ul class="footer-nav">
          {{ range .Site.Menus.main }}
          <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </div>
      <div class="footer-connect">
        <h4 class="footer-heading">Connect</h4>
        <p class="footer-email">
          <a href="mailto:contact@openhealth5g.org">contact@openhealth5g.org</a>
        </p>
      </div>
    </div>
    <div class="footer-bottom">
      <p class="footer-copy">&copy; {{ now.Format "2006" }} OpenHealth5G Research Consortium. All rights reserved.</p>
    </div>
  </div>
</footer>
